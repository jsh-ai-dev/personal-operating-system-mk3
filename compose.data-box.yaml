# [인프라 구성] AWS data-box에서 MongoDB/Qdrant만 실행하는 전용 Compose 파일
# 로컬 학습용 compose.yaml과 분리해, 배포 환경에서 필요한 포트 바인딩/시크릿 요구사항을 명확히 고정한다.

services:
  mongodb:
    image: mongo:7
    container_name: personal-operating-system-mk3-mongodb
    env_file:
      - .env.data-box
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MK3_MONGO_USERNAME:-pos}
      MONGO_INITDB_ROOT_PASSWORD: ${MK3_MONGO_PASSWORD:?MK3_MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MK3_MONGO_DB:-pos_mk3}
      TZ: ${MK3_TZ:-Asia/Seoul}
    ports:
      - "${MK3_MONGO_BIND:-0.0.0.0}:${MK3_MONGO_PORT:-27017}:27017"
    volumes:
      - personal-operating-system-mk3-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: personal-operating-system-mk3-qdrant
    env_file:
      - .env.data-box
    ports:
      - "${MK3_QDRANT_BIND:-0.0.0.0}:${MK3_QDRANT_HTTP_PORT:-6333}:6333"
      - "${MK3_QDRANT_BIND:-0.0.0.0}:${MK3_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - personal-operating-system-mk3-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.2
    container_name: personal-operating-system-mk3-kafka
    user: "0:0"
    env_file:
      - .env.data-box
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_ADVERTISED_HOST:?KAFKA_EXTERNAL_ADVERTISED_HOST is required}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-72}
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${KAFKA_BIND:-0.0.0.0}:${KAFKA_EXTERNAL_PORT:-9092}:9094"
    volumes:
      - personal-operating-system-mk3-kafka-data:/tmp/kraft-combined-logs
    restart: unless-stopped

volumes:
  personal-operating-system-mk3-mongodb-data:
  personal-operating-system-mk3-qdrant-data:
  personal-operating-system-mk3-kafka-data:
