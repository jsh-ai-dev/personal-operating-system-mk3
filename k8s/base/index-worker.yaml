apiVersion: apps/v1
kind: Deployment
metadata:
  name: mk3-index-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mk3-index-worker
  template:
    metadata:
      labels:
        app: mk3-index-worker
    spec:
      containers:
        - name: index-worker
          image: personal-operating-system-mk3-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.conversation_index_worker"]
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: mk3-secret
                  key: MONGODB_URL
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: MONGODB_DB
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: QDRANT_HOST
            - name: QDRANT_PORT
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: QDRANT_PORT
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mk3-secret
                  key: QDRANT_API_KEY
            - name: KAFKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: KAFKA_ENABLED
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONVERSATION_INDEX_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: KAFKA_CONVERSATION_INDEX_TOPIC
            - name: KAFKA_CONVERSATION_INDEX_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: mk3-config
                  key: KAFKA_CONVERSATION_INDEX_GROUP_ID
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mk3-secret
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
